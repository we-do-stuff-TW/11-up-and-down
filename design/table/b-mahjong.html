<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>B 自動麻將桌</title>
<style>
:root{
  --room:#16110E; --walnut:#4A2D1F; --walnut-2:#2E1B12; --trim:#E8DFCB;
  --mat:#2B6A66; --mat-2:#1C4A47; --console:#ECE5D6; --console-2:#CFC6B2;
  --led:#FF4B2E; --led-off:#3A1712; --lamp:#FFB23E; --lamp-off:#B6AD9B;
  --ivory:#EFE8D8; --ink:#2A2420; --ink-2:#6B5F52;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--room)}
body{position:relative;width:390px;height:844px;overflow:clip;color:var(--ink);
  background:radial-gradient(ellipse 90% 50% at 50% 38%, #2A1F18 0%, var(--room) 70%);
  font:14px/1.3 -apple-system,"PingFang TC","Noto Sans TC",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums}

.top{position:absolute;left:12px;right:12px;top:10px;height:34px;display:flex;align-items:center;gap:8px;color:#CDBFA8;font-size:13px}
.top b{color:#F1E7D3;font-weight:600}
.menu{margin-left:auto;width:36px;height:32px;border-radius:8px;border:1px solid #4A3A2E;display:grid;place-items:center}

/* 方桌：胡桃木框＋奶油色內線＋藍綠桌墊，中間一座控制台 */
.stage{position:absolute;left:0;top:58px;width:390px;height:560px;perspective:820px;perspective-origin:50% 0%}
.table{position:absolute;left:4px;top:0;width:382px;height:600px;transform:rotateX(40deg);transform-origin:50% 30%;
  border-radius:22px;background:linear-gradient(160deg, #6A422D, var(--walnut) 40%, var(--walnut-2));
  box-shadow:0 50px 70px rgba(0,0,0,.6), inset 0 2px 0 rgba(255,255,255,.12)}
.mat{position:absolute;left:18px;top:18px;right:18px;bottom:18px;border-radius:10px;
  box-shadow:0 0 0 3px var(--trim), inset 0 0 50px rgba(0,0,0,.35);
  background:radial-gradient(ellipse 70% 60% at 50% 48%, #34807A 0%, var(--mat) 50%, var(--mat-2) 100%)}
.mat > *{position:absolute}
.console{left:50%;top:41%;width:140px;height:140px;margin:-70px 0 0 -70px;border-radius:24px;
  background:linear-gradient(150deg, #F7F2E6, var(--console) 55%, var(--console-2));
  box-shadow:0 10px 18px rgba(0,0,0,.45), inset 0 -3px 0 rgba(0,0,0,.12)}
.dome{position:absolute;left:38px;top:38px;width:64px;height:64px;border-radius:50%;
  background:radial-gradient(circle at 36% 30%, rgba(255,255,255,.75), rgba(255,255,255,.12) 30%, rgba(40,60,60,.35) 75%);
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.55), inset 0 -6px 12px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;gap:4px}
.lamp{position:absolute;width:20px;height:7px;border-radius:4px;background:var(--lamp-off);box-shadow:inset 0 1px 1px rgba(0,0,0,.25)}
.lamp.on{background:var(--lamp);box-shadow:0 0 0 2px rgba(255,178,62,.35)}
.ledbox{left:50%;top:58%;transform:translateX(-50%);padding:5px 9px;border-radius:6px;background:#1A0C09;display:flex;gap:6px;align-items:center;box-shadow:0 0 0 3px #CFC6B2, 0 6px 10px rgba(0,0,0,.4)}
.ledbox .lbl{color:#9C5A48;font-size:11px;font-weight:600;margin-right:4px}
.rack{display:flex;align-items:flex-end;padding:0 6px 6px;height:36px;border-radius:5px;
  background:linear-gradient(180deg, #7A5038, #4A2D1F);box-shadow:0 4px 6px rgba(0,0,0,.4)}
.rack .cd{margin-left:-24px;box-shadow:0 1px 2px rgba(0,0,0,.4)}
.rack .cd:first-child{margin-left:0}
.mat .cd{box-shadow:0 2px 3px rgba(0,0,0,.45)}
.mat .die{filter:drop-shadow(0 2px 1px rgba(0,0,0,.4))}

/* 桌緣的象牙名牌：名字、叫幾墩、拿了幾墩 */
.plaque{position:absolute;transform:translateX(-50%);padding:4px 9px 5px;border-radius:6px;background:var(--ivory);
  box-shadow:0 3px 8px rgba(0,0,0,.5), inset 0 -2px 0 rgba(0,0,0,.08);display:flex;align-items:center;gap:7px;white-space:nowrap}
.plaque .nm{font-weight:700;font-size:13px}
.plaque .v{font-size:12px;color:var(--ink-2);display:flex;align-items:center;gap:3px}
.plaque .v b{color:var(--ink);font-weight:700}
.zero{display:inline-grid;place-items:center;border-radius:3px;border:1px solid var(--ink-2);color:var(--ink);font-weight:700;line-height:1}

/* 我的牌架：牌站著插在架上，被選得出去的那幾張自己浮起來 */
.myrack{position:absolute;left:0;right:0;top:560px;bottom:0}
.myrack .cd{position:absolute;box-shadow:0 8px 16px rgba(0,0,0,.55), 0 1px 2px rgba(0,0,0,.4)}
.myrack .cd.no{filter:brightness(.66) saturate(.8)}
.lip{position:absolute;left:-4px;right:-4px;bottom:0;height:58px;border-radius:14px 14px 0 0;
  background:linear-gradient(180deg, #8A5B40 0%, #5A3826 30%, #3A2317 100%);
  box-shadow:0 -6px 14px rgba(0,0,0,.5), inset 0 2px 0 rgba(255,220,180,.25)}
.lip .strip{position:absolute;left:24px;right:24px;top:-3px;height:4px;border-radius:2px;background:var(--lamp)}
.lip .me{position:absolute;left:16px;right:16px;top:16px;display:flex;align-items:center;gap:10px;color:#F3E8D4;font-size:13px}
.lip .me b{font-weight:700}
.lip .me .go{margin-left:auto;color:var(--lamp);font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px}
.lip .me .go i{width:9px;height:9px;border-radius:50%;background:var(--lamp)}
</style>
</head>
<body>
<div class="top"><span>房 <b class="num">5527</b></span>
  <div class="menu" aria-label="選單"><svg width="18" height="14" viewBox="0 0 18 14"><path d="M1 1h16M1 7h16M1 13h16" stroke="#CDBFA8" stroke-width="2" stroke-linecap="round"/></svg></div></div>
<div class="stage"><div class="table"><div class="mat" id="mat"></div></div></div>
<div id="plaques"></div>
<div class="myrack" id="myrack"></div>
<script src="_kit.js"></script>
<script>
const K = KIT;
const mat = document.getElementById("mat");
let m = "";

/* 控制台：圓罩裡是骰子（叫墩就是在這裡丟），一圈六盞燈指著輪到誰，LED 寫局數與王牌 */
const LAMP = {0:90, 1:30, 2:-30, 3:-90, 4:-150, 5:150};
let lamps = "";
for(const st in LAMP){
  const a = LAMP[st] * Math.PI / 180, x = 70 + 50 * Math.cos(a) - 10, y = 70 + 50 * Math.sin(a) - 3.5;
  lamps += '<div class="lamp' + (st == 0 ? ' on' : '') + '" style="left:' + x.toFixed(1) + 'px;top:' + y.toFixed(1) + 'px;transform:rotate(' + (LAMP[st] + 90) + 'deg)"></div>';
}
m += '<div class="console">' + lamps + '<div class="dome">' + K.die(2, 20) + K.die(5, 20) + '</div></div>' +
  '<div class="ledbox">' + K.seg7("08", 18, "#FF4B2E", "#3A1712") + '<span class="lbl">局</span>' + K.suit("S", 16, "#FF4B2E") + '<span class="lbl">王牌</span></div>';

/* 對手的牌架（牌背朝我）與丟在自己面前的骰子、出的牌——跟麻將的打牌一樣，出的牌放在自己前面 */
const R = {
  3:{rack:[136, 10, 0], dice:[112, 66], card:[156, 58, -3]},
  2:{rack:[262, 96, 0], dice:[270, 152]},
  4:{rack:[10, 96, 0], dice:[100, 104], card:[30, 146, -8]},
  1:{rack:[262, 330, 0], dice:[268, 290]},
  5:{rack:[10, 330, 0], dice:[104, 312], card:[34, 236, 7]}
};
const TRICK = {}; K.TRICK.forEach(function(t){ TRICK[t.p] = t.c; });
for(const s in R){
  const p = K.P[s], r = R[s];
  let backs = ""; for(let k = 0; k < 6 - (s == 2 ? 1 : 0); k++) backs += K.card("back", 30);
  m += '<div class="rack" style="left:' + r.rack[0] + 'px;top:' + r.rack[1] + 'px">' + backs + '</div>';
  if(p.bid > 0) m += '<div style="left:' + r.dice[0] + 'px;top:' + r.dice[1] + 'px;display:flex;gap:3px;transform:rotate(' + (s * 17 % 30 - 15) + 'deg)">' +
    (p.bid > 2 ? K.die(2, 20) + K.die(p.bid - 2, 20) : K.die(p.bid, 20)) + '</div>';
  if(TRICK[s]) m += '<div style="left:' + r.card[0] + 'px;top:' + r.card[1] + 'px;transform:rotate(' + r.card[2] + 'deg)">' + K.card(TRICK[s], 60) + '</div>';
}
m += '<div style="left:200px;top:470px;transform:rotate(-8deg)">' + K.die(2, 22) + '</div>';
mat.innerHTML = m;

/* 名牌貼在桌緣，不跟著透視縮小 */
const PLQ = {3:[195, 74], 4:[72, 186], 2:[318, 186], 5:[66, 382], 1:[324, 382]};
let pq = "";
for(const s in PLQ){
  const p = K.P[s], a = PLQ[s];
  pq += '<div class="plaque" style="left:' + a[0] + 'px;top:' + a[1] + 'px"><span class="nm">' + p.n + '</span>' +
    '<span class="v">叫 ' + K.bidMark(p.bid, 13, {body:"#fff", edge:"#9a8f80"}) + '</span><span class="v">拿 <b class="num">' + p.won + '</b></span></div>';
}
document.getElementById("plaques").innerHTML = pq;

/* 我的牌架 */
const W = 140, pos = K.fan(K.HAND.length, W, 390 - 40);
let h = "";
K.HAND.forEach(function(id, k){
  const ok = K.LEGAL[id];
  h += K.card(id, W, 'left:' + (20 + pos[k].x).toFixed(1) + 'px;top:' + (34 - (ok ? 30 : 0)) + 'px').replace('class="cd"', 'class="cd' + (ok ? '' : ' no') + '"');
});
const me = K.P[0];
h += '<div class="lip"><div class="strip"></div><div class="me"><b>Francis（你）</b><span>叫 ' + K.die(me.bid, 13) + '</span><span>拿 <b class="num">' + me.won + '</b></span>' +
  '<span class="go"><i></i>輪到你出牌</span></div></div>';
document.getElementById("myrack").innerHTML = h;
</script>
</body>
</html>
