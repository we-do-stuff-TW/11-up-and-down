<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>A 群組通話</title>
<style>
:root{
  --ink:#0E1218; --plate:#171C24; --plate-2:#1E242E; --line:#2B323D;
  --txt:#EEF0F3; --mut:#9AA2AF; --live:#F2B13A;
  --felt:#21443D; --felt-2:#16302C; --rail:#2A211C;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--ink)}
body{position:relative;width:390px;height:844px;overflow:clip;background:var(--ink);color:var(--txt);
  font:14px/1.3 -apple-system,"PingFang TC","Noto Sans TC",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums}

/* 頂上一行：通話的標題列。房號、局數、王牌，其他收進選單 */
.top{position:absolute;left:12px;right:12px;top:10px;height:36px;display:flex;align-items:center;gap:8px}
.pill{height:32px;padding:0 12px;border-radius:10px;background:var(--plate);border:1px solid var(--line);
  display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mut);white-space:nowrap}
.pill b{color:var(--txt);font-weight:600;font-size:14px}
.pill .cd{box-shadow:0 1px 2px rgba(0,0,0,.4)}
.menu{margin-left:auto;width:36px;height:32px;border-radius:10px;background:var(--plate);border:1px solid var(--line);display:grid;place-items:center}

/* 牌桌：保留立體桌，換成夜裡通話的底 */
.stage{position:absolute;left:0;top:96px;width:390px;height:420px;perspective:760px;perspective-origin:50% -10%}
.felt{position:absolute;left:22px;top:0;width:346px;height:440px;border-radius:50%;
  transform:rotateX(48deg);transform-origin:50% 40%;transform-style:preserve-3d;
  background:radial-gradient(ellipse 60% 55% at 50% 46%, #2A5249 0%, var(--felt) 45%, var(--felt-2) 100%);
  box-shadow:0 0 0 12px var(--rail), 0 0 0 13px #3a2e26, 0 40px 60px rgba(0,0,0,.55)}
.felt > *{position:absolute}
.felt .cd{box-shadow:0 2px 3px rgba(0,0,0,.45)}
.felt .tag{position:absolute;left:-9px;top:-9px;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;color:#0E1218;box-shadow:0 1px 2px rgba(0,0,0,.5)}
.felt .die{filter:drop-shadow(0 2px 1px rgba(0,0,0,.45))}

/* 每個人一格：大頭貼、名字、叫幾墩（骰子）與拿了幾墩 */
.tile{position:absolute;width:78px;display:flex;flex-direction:column;align-items:center;gap:4px;transform:translateX(-50%)}
.av{width:50px;height:50px;border-radius:14px;background:var(--plate-2);display:grid;place-items:center;
  font-size:20px;font-weight:600;color:var(--txt);box-shadow:inset 0 0 0 2px var(--pc), 0 6px 14px rgba(0,0,0,.45)}
.nm{font-size:12.5px;font-weight:600;max-width:78px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st{height:22px;padding:0 7px 0 4px;border-radius:7px;background:rgba(14,18,24,.82);border:1px solid var(--line);
  display:flex;align-items:center;gap:5px;font-size:12px;color:var(--mut)}
.st b{color:var(--txt);font-weight:600}
.zero{display:inline-grid;place-items:center;border-radius:4px;border:1px solid #6b7380;color:var(--txt);font-weight:600;line-height:1}

/* 我的那一格：自己的畫面。輪到我＝這一格亮起來 */
.me{position:absolute;left:0;right:0;top:524px;bottom:0;background:var(--plate);border-radius:26px 26px 0 0;
  box-shadow:inset 0 0 0 2px var(--live), 0 -18px 40px rgba(0,0,0,.45)}
.me .hd{position:absolute;left:16px;right:16px;top:14px;height:36px;display:flex;align-items:center;gap:10px}
.me .av{width:34px;height:34px;border-radius:10px;font-size:15px;box-shadow:inset 0 0 0 2px var(--pc)}
.me .who{font-size:15px;font-weight:600}
.me .meta{font-size:13px;color:var(--mut);display:flex;align-items:center;gap:6px}
.me .meta b{color:var(--txt)}
.me .turn{margin-left:auto;height:30px;padding:0 12px;border-radius:9px;background:var(--live);color:#1A1406;font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px}
.hand{position:absolute;left:0;top:0;width:390px;height:844px;pointer-events:none}
.hand .cd{position:absolute;box-shadow:0 6px 16px rgba(0,0,0,.5), 0 1px 2px rgba(0,0,0,.4);transform-origin:50% 120%}
.hand .cd.no{filter:brightness(.62) saturate(.75)}
</style>
</head>
<body>
<div class="top">
  <div class="pill">房 <b class="num">5527</b></div>
  <div class="pill">第 <b class="num">8</b><span class="num">/15</span> 局</div>
  <div class="pill" id="trump"></div>
  <div class="menu" aria-label="選單"><svg width="18" height="14" viewBox="0 0 18 14"><path d="M1 1h16M1 7h16M1 13h16" stroke="#C9CFD8" stroke-width="2" stroke-linecap="round"/></svg></div>
</div>
<div class="stage"><div class="felt" id="felt"></div></div>
<div id="tiles"></div>
<div class="me" id="me"></div>
<div class="hand" id="hand"></div>
<script src="_kit.js"></script>
<script>
const K = KIT;
const COL = ["#7FB59A", "#6E93C8", "#E2725B", "#B79AD8", "#4FB0B5", "#D97A9C"];
document.getElementById("trump").innerHTML = K.card("SJ", 18) + '王牌 <b>♠</b>'.replace("♠", K.suit("S", 13, "#EEF0F3"));

/* 五個對手左右對稱排在桌緣：我在正下方 */
const SPOT = {1:[350, 316], 2:[322, 116], 3:[195, 62], 4:[68, 116], 5:[40, 316]};
let tiles = "";
for(let s = 1; s < 6; s++){
  const p = K.P[s], at = SPOT[s];
  tiles += '<div class="tile" style="left:' + at[0] + 'px;top:' + at[1] + 'px;--pc:' + COL[s] + '">' +
    '<div class="av">' + p.i + '</div><div class="nm">' + p.n + '</div>' +
    '<div class="st">' + K.bidMark(p.bid, 15) + '<span>拿 <b class="num">' + p.won + '</b></span></div></div>';
}
document.getElementById("tiles").innerHTML = tiles;

/* 桌上：這一墩出了的三張（每張底下一條出牌人的顏色），以及大家叫墩丟的骰子 */
const felt = document.getElementById("felt");
const TRICK_AT = {3:[168, 96, -4], 4:[70, 146, -14], 5:[118, 250, 10]};
let f = "";
K.TRICK.forEach(function(t){
  const a = TRICK_AT[t.p];
  f += '<div style="left:' + a[0] + 'px;top:' + a[1] + 'px;transform:rotate(' + a[2] + 'deg)">' + K.card(t.c, 74) +
       '<div class="tag" style="background:' + COL[t.p] + '">' + K.P[t.p].i + '</div></div>';
});
const DICE_AT = {0:[166, 352], 1:[262, 262], 2:[236, 92], 4:[82, 96], 5:[52, 262]};
for(const s in DICE_AT){
  const p = K.P[s], a = DICE_AT[s];
  if(p.bid > 0) f += '<div style="left:' + a[0] + 'px;top:' + a[1] + 'px;transform:rotate(' + (s * 23 % 40 - 20) + 'deg);display:flex;gap:4px">' +
    (p.bid > 2 ? K.die(2, 22) + K.die(p.bid - 2, 22) : K.die(p.bid, 22)) + '</div>';
}
felt.innerHTML = f;

/* 我的那一格 */
const me = K.P[0];
document.getElementById("me").innerHTML = '<div class="hd" style="--pc:' + COL[0] + '">' +
  '<div class="av">' + me.i + '</div><div><div class="who">Francis（你）</div>' +
  '<div class="meta">叫 ' + K.die(me.bid, 13) + ' <span>拿 <b class="num">' + me.won + '</b></span></div></div>' +
  '<div class="turn">輪到你出牌</div></div>';

/* 手牌：每一局都同一個大小（1 張、11 張都一樣大），只改重疊。下緣貼著畫面底，不留白 */
const W = 138, pos = K.fan(K.HAND.length, W, 390 - 48, {spread:8, arc:10});
let h = "";
K.HAND.forEach(function(id, k){
  const ok = K.LEGAL[id], p = pos[k];
  h += K.card(id, W, 'left:' + (24 + p.x).toFixed(1) + 'px;top:' + (612 + p.dy - (ok ? 26 : 0)).toFixed(1) + 'px;transform:rotate(' + p.rot.toFixed(1) + 'deg)').replace('class="cd"', 'class="cd' + (ok ? '' : ' no') + '"');
});
document.getElementById("hand").innerHTML = h;
</script>
</body>
</html>
