<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>C 翻牌看板</title>
<style>
:root{
  --room:#141210; --steel:#8E9398; --steel-2:#5E6368; --flap:#161616; --flap-2:#222; --chalk:#F2F0EA; --chalk-2:#A9A69F;
  --lamp:#F5A524; --red:#C4382B; --felt:#1E4C3D; --felt-2:#12342A; --rail:#4B2E1E;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--room)}
body{position:relative;width:390px;height:844px;overflow:clip;color:var(--chalk);
  background:radial-gradient(ellipse 90% 55% at 50% 45%, #251F1A 0%, var(--room) 70%);
  font:14px/1.3 -apple-system,"PingFang TC","Noto Sans TC",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.cond{font-family:"DIN Condensed","Barlow Condensed","Arial Narrow",sans-serif;font-weight:700}

/* 翻牌字：每個字一格，中間一道分割線 */
.f{display:inline-grid;place-items:center;width:22px;height:32px;border-radius:3px;position:relative;
  background:linear-gradient(180deg, var(--flap-2) 0 49%, #0B0B0B 49% 51%, var(--flap) 51% 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08), 0 1px 1px rgba(0,0,0,.6);
  font-family:"DIN Condensed","Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;font-size:26px;line-height:1;padding-top:4px;color:var(--chalk)}
.f.s{width:18px;height:26px;font-size:21px}
.f.cjk{font-family:-apple-system,"PingFang TC",sans-serif;font-size:17px;padding-top:0;font-weight:600}
.f.s.cjk{font-size:14px}
.f.amber{color:var(--lamp)}
.f svg{display:block}
.grp{display:flex;flex-direction:column;align-items:center;gap:4px}
.grp .lb{font-size:10.5px;letter-spacing:.12em;color:var(--chalk-2)}
.row{display:flex;gap:2px;align-items:center}

/* 頂上的看板：鋼框裡一排翻牌 */
.board{position:absolute;left:8px;right:8px;top:8px;height:80px;border-radius:10px;padding:5px;
  background:linear-gradient(180deg, #A9AEB3, var(--steel) 40%, var(--steel-2));box-shadow:0 10px 24px rgba(0,0,0,.5)}
.board .in{height:100%;border-radius:6px;background:#0A0A0A;display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 14px}
.board .room{font-size:11px;color:var(--chalk-2);letter-spacing:.1em}
.menu{width:30px;height:30px;border-radius:6px;border:1px solid #3a3a3a;display:grid;place-items:center}

/* 牌桌：跟現在一樣是立體的綠桌，只是桌上的字全部改由看板與翻牌名牌來講 */
.stage{position:absolute;left:0;top:98px;width:390px;height:430px;perspective:760px;perspective-origin:50% -5%}
.felt{position:absolute;left:18px;top:6px;width:354px;height:440px;border-radius:50%;transform:rotateX(48deg);transform-origin:50% 40%;
  background:radial-gradient(ellipse 60% 55% at 50% 46%, #2A6550 0%, var(--felt) 48%, var(--felt-2) 100%);
  box-shadow:0 0 0 13px var(--rail), 0 0 0 14px #6a4630, 0 40px 60px rgba(0,0,0,.6)}
.felt > *{position:absolute}
.felt .cd{box-shadow:0 2px 3px rgba(0,0,0,.45)}
.felt .die{filter:drop-shadow(0 2px 1px rgba(0,0,0,.45))}

/* 每個人的翻牌名牌：名字一條，下面兩格是叫幾墩、拿了幾墩 */
.seat{position:absolute;transform:translateX(-50%);background:#0C0C0C;border-radius:7px;padding:5px 7px 6px;
  box-shadow:0 0 0 2px #3A3D40, 0 8px 16px rgba(0,0,0,.55);display:flex;flex-direction:column;align-items:center;gap:4px}
.seat .nm{font-size:12px;font-weight:600;color:var(--chalk);display:flex;align-items:center;gap:5px;white-space:nowrap}
.seat .nm i{width:7px;height:7px;border-radius:50%;background:#333}
.seat .nm i.on{background:var(--lamp)}
.seat .row{gap:6px}
.seat .pair{display:flex;align-items:center;gap:3px}
.seat .pair .lbl{font-size:10px;color:var(--chalk-2)}

/* 我的牌：輪到我＝看板那一列翻成「輪到你出牌」，燈亮 */
.hand{position:absolute;left:0;top:0;width:390px;height:844px;pointer-events:none}
.hand .cd{position:absolute;box-shadow:0 6px 16px rgba(0,0,0,.5), 0 1px 2px rgba(0,0,0,.4);transform-origin:50% 120%}
.hand .cd.no{filter:brightness(.62) saturate(.75)}
.mybar{position:absolute;left:8px;right:8px;top:532px;height:46px;border-radius:8px;background:#0A0A0A;
  box-shadow:0 0 0 2px #3A3D40;display:flex;align-items:center;gap:10px;padding:0 10px}
.mybar .lamp{width:10px;height:10px;border-radius:50%;background:var(--lamp);box-shadow:0 0 0 3px rgba(245,165,36,.25)}
.mybar .me{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--chalk-2)}
</style>
</head>
<body>
<div class="board"><div class="in" id="board"></div></div>
<div class="stage"><div class="felt" id="felt"></div></div>
<div id="seats"></div>
<div class="mybar" id="mybar"></div>
<div class="hand" id="hand"></div>
<script src="_kit.js"></script>
<script>
const K = KIT;
const F = (str, cls) => Array.from(str).map(ch => '<span class="f ' + (cls || "") + (/[一-鿿]/.test(ch) ? " cjk" : "") + '">' + ch + '</span>').join("");
document.getElementById("board").innerHTML =
  '<div class="grp"><span class="lb">局</span><div class="row">' + F("08") + '<span class="cond" style="color:#666;font-size:20px;margin:0 2px">/</span>' + F("15", "s") + '</div></div>' +
  '<div class="grp"><span class="lb">王牌</span><div class="row"><span class="f">' + K.suit("S", 17, "#F2F0EA") + '</span>' + F("J") + '</div></div>' +
  '<div class="grp"><span class="lb">墩</span><div class="row">' + F("2") + '<span class="cond" style="color:#666;font-size:20px;margin:0 2px">/</span>' + F("8") + '</div></div>' +
  '<div class="grp" style="gap:6px"><span class="room">5527</span><div class="menu"><svg width="16" height="12" viewBox="0 0 16 12"><path d="M1 1h14M1 6h14M1 11h14" stroke="#BBB" stroke-width="2" stroke-linecap="round"/></svg></div></div>';

const SPOT = {1:[344, 318], 2:[316, 112], 3:[195, 96], 4:[74, 112], 5:[46, 318]};
let st = "";
for(let s = 1; s < 6; s++){
  const p = K.P[s], a = SPOT[s];
  st += '<div class="seat" style="left:' + a[0] + 'px;top:' + a[1] + 'px"><div class="nm"><i></i>' + p.n + '</div>' +
    '<div class="row"><span class="pair"><span class="lbl">叫</span>' + F(String(p.bid), "s") + '</span><span class="pair"><span class="lbl">拿</span>' + F(String(p.won), "s") + '</span></div></div>';
}
document.getElementById("seats").innerHTML = st;

const felt = document.getElementById("felt");
let f = "";
const TRICK_AT = {3:[152, 110, -4], 4:[76, 156, -14], 5:[104, 250, 10]};
K.TRICK.forEach(function(t){ const a = TRICK_AT[t.p]; f += '<div style="left:' + a[0] + 'px;top:' + a[1] + 'px;transform:rotate(' + a[2] + 'deg)">' + K.card(t.c, 74) + '</div>'; });
const DICE_AT = {0:[166, 352], 1:[266, 262], 2:[240, 96], 4:[84, 100], 5:[54, 262]};
for(const s in DICE_AT){ const p = K.P[s], a = DICE_AT[s];
  if(p.bid > 0) f += '<div style="left:' + a[0] + 'px;top:' + a[1] + 'px;transform:rotate(' + (s * 23 % 40 - 20) + 'deg);display:flex;gap:4px">' +
    (p.bid > 2 ? K.die(2, 22) + K.die(p.bid - 2, 22) : K.die(p.bid, 22)) + '</div>'; }
felt.innerHTML = f;

const me = K.P[0];
document.getElementById("mybar").innerHTML = '<span class="lamp"></span><div class="row">' + F("輪到你出牌", "amber") + '</div>' +
  '<div class="me"><b style="color:#F2F0EA;font-size:13px">Francis</b><span class="pair" style="display:flex;gap:3px;align-items:center">叫' + F(String(me.bid), "s") + '</span><span class="pair" style="display:flex;gap:3px;align-items:center">拿' + F(String(me.won), "s") + '</span></div>';

const W = 138, pos = K.fan(K.HAND.length, W, 390 - 48, {spread:8, arc:10});
let h = "";
K.HAND.forEach(function(id, k){ const ok = K.LEGAL[id], p = pos[k];
  h += K.card(id, W, 'left:' + (24 + p.x).toFixed(1) + 'px;top:' + (622 + p.dy - (ok ? 26 : 0)).toFixed(1) + 'px;transform:rotate(' + p.rot.toFixed(1) + 'deg)').replace('class="cd"', 'class="cd' + (ok ? '' : ' no') + '"'); });
document.getElementById("hand").innerHTML = h;
</script>
</body>
</html>
