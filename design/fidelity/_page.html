<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>立體牌桌・仿真度比較</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600&family=Bodoni+Moda:opsz,wght@6..96,500;6..96,600&display=swap">
<style>
:root{
  color-scheme:dark;
  --ink:#F2EAD9; --ink-2:#A79C88; --ink-3:#6E6552;
  --bg:#0B0908; --panel:#15110E; --line:rgba(242,234,217,.12);
  --brass:#C9A552; --brass-d:#8A6F35; --moss:#2A4A3C; --red:#C8623F;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font:14px/1.5 "Archivo","Helvetica Neue",Arial,"PingFang TC","Noto Sans TC",sans-serif;
  -webkit-font-smoothing:antialiased;overflow:hidden}
#wrap{position:fixed;inset:0;display:flex}
#stage{position:relative;flex:1;min-width:0}
canvas#gl{display:block;width:100%;height:100%}

/* ---- 右邊控制台 ---- */
#panel{width:318px;flex:none;background:var(--panel);border-left:1px solid var(--line);
  overflow-y:auto;padding:18px 18px 40px;position:relative;z-index:3}
#panel h1{font-family:"Bodoni Moda",Georgia,serif;font-size:21px;font-optical-sizing:auto;
  letter-spacing:.01em;margin:0 0 4px;font-weight:500}
#panel .sub{font-size:11.5px;color:var(--ink-3);line-height:1.45;margin:0 0 18px}
.sect{font-size:10.5px;letter-spacing:.16em;color:var(--ink-3);margin:22px 0 9px;
  padding-bottom:6px;border-bottom:1px solid var(--line)}
.sect:first-of-type{margin-top:14px}

.pre{display:grid;gap:6px}
.pre button{all:unset;display:block;cursor:pointer;padding:9px 11px;border-radius:7px;
  border:1px solid var(--line);background:transparent;transition:.13s}
.pre button:hover{background:rgba(242,234,217,.05)}
.pre button.on{border-color:var(--brass);background:rgba(201,165,82,.10)}
.pre b{display:block;font-size:13px;font-weight:600;letter-spacing:.02em}
.pre b::first-letter{font-family:"Bodoni Moda",Georgia,serif;font-size:1.25em;letter-spacing:.06em}
.pre em{display:block;font-style:normal;font-size:11px;color:var(--ink-3);margin-top:2px}
.pre button.on b{color:var(--brass)}

.tog{display:flex;gap:9px;align-items:flex-start;padding:7px 0;cursor:pointer;
  border-bottom:1px solid rgba(242,234,217,.05)}
.tog:last-child{border-bottom:0}
.tog input{appearance:none;margin:2px 0 0;width:15px;height:15px;flex:none;border-radius:4px;
  border:1px solid rgba(242,234,217,.28);cursor:pointer;position:relative}
.tog input:checked{background:var(--brass);border-color:var(--brass)}
.tog input:checked::after{content:"";position:absolute;left:4px;top:1px;width:4px;height:8px;
  border:solid #15110E;border-width:0 2px 2px 0;transform:rotate(42deg)}
.tog .tx b{display:block;font-size:12.5px;font-weight:600}
.tog .tx span{display:block;font-size:11px;color:var(--ink-3);line-height:1.4;margin-top:1px}
.tog.dim{opacity:.42}

.row{display:flex;gap:7px;margin-top:11px}
.row button{all:unset;flex:1 1 auto;min-width:62px;text-align:center;cursor:pointer;padding:8px 6px;border-radius:7px;
  font-size:12px;border:1px solid var(--line);transition:.13s}
.row button:hover{background:rgba(242,234,217,.05)}
.row button.go{border-color:var(--brass-d);color:var(--brass)}

#stat{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;color:var(--ink-3);
  margin-top:12px;line-height:1.6}
#stat b{color:var(--ink-2);font-weight:600}

#hint{position:absolute;left:16px;bottom:14px;z-index:2;font-size:11.5px;color:rgba(242,234,217,.34);
  pointer-events:none;letter-spacing:.02em}
#load{position:absolute;inset:0;display:grid;place-items:center;z-index:4;background:var(--bg);
  color:var(--ink-3);font-size:12.5px;letter-spacing:.1em;transition:opacity .4s}
#load.gone{opacity:0;pointer-events:none}

/* ---- 前後對照的抹除滑桿 ---- */
#wipe{position:absolute;inset:0;z-index:5;display:none;background:#000}
#wipe.on{display:block}
#wipe img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#wipeB{clip-path:inset(0 0 0 var(--k,50%))}
#wipeBar{position:absolute;top:0;bottom:0;left:var(--k,50%);width:2px;background:rgba(255,255,255,.85);
  box-shadow:0 0 14px rgba(0,0,0,.8);transform:translateX(-1px)}
#wipeBar::after{content:"";position:absolute;top:50%;left:50%;width:38px;height:38px;margin:-19px;
  border-radius:99px;border:2px solid rgba(255,255,255,.85);background:rgba(0,0,0,.35)}
#wipe input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:ew-resize;margin:0}
#wipe .tag{position:absolute;top:16px;font-size:11px;letter-spacing:.14em;color:#fff;
  background:rgba(0,0,0,.55);padding:5px 10px;border-radius:5px;backdrop-filter:blur(6px)}
#wipe .tag.l{left:16px} #wipe .tag.r{right:16px}
#wipe .x{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);cursor:pointer;
  font-size:11.5px;letter-spacing:.1em;color:#fff;background:rgba(0,0,0,.55);padding:7px 14px;
  border-radius:99px;border:1px solid rgba(255,255,255,.25)}

@media (max-width:820px){
  #wrap{flex-direction:column}
  #panel{width:auto;height:47%;border-left:0;border-top:1px solid var(--line)}
  #stage{height:53%}
}
</style>

<div id="wrap">
  <div id="stage">
    <canvas id="gl"></canvas>
    <div id="hint">拖曳＝轉鏡頭　滾輪＝推近拉遠</div>
    <div id="load">正在鋪桌…</div>
    <div id="wipe">
      <img id="wipeA"><img id="wipeB">
      <div id="wipeBar"></div>
      <input id="wipeK" type="range" min="0" max="100" value="50">
      <div class="tag l" id="wipeLa">A</div><div class="tag r" id="wipeLb">B</div>
      <div class="x" id="wipeX">關掉對照</div>
    </div>
  </div>

  <div id="panel">
    <h1>立體牌桌・仿真度比較</h1>
    <p class="sub">桌布、木沿、書房、骰子的材質與貼圖是直接從 <code>docs/index.html</code> 抄過來的，
      所以「A 現在」就是線上現在的樣子。牌面用簡化版——這一頁比的是光與材質，不是牌面設計。</p>

    <div class="sect">視角</div>
    <div class="row" id="view" style="margin-top:0;flex-wrap:wrap"></div>

    <div class="sect">四個風格預設</div>
    <div class="pre" id="pre"></div>

    <div class="sect">每一項可單獨開關</div>
    <div id="togs"></div>

    <div class="row">
      <button id="shot" class="go">拍前後對照</button>
      <button id="reset">回到 A</button>
    </div>
    <div id="stat"></div>
    <p class="sub" style="margin:10px 0 0">毫秒數是你這台機器的數字。這一層是「不動就不畫」，
      所以後處理只在畫面真的在動的那幾格付錢。</p>
  </div>
</div>

<script type="module">

</script>
