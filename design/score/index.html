<header>
  <h1>計分表 · 三案</h1>
  <p>同一場牌（4 人、打到第 14 局），三種畫法。牌桌那一側只是示意，要看的是右邊那一欄。
     想看極端就加 <code>?n=10</code>（十個人、階梯只到 6 張），手機寬看 <code>phone.html</code>。</p>
</header>
<div class="row">
  <figure><figcaption><b>A · 記分簿</b><span>結構不動，尺寸與層級重排。總分變成頂上的大字，每一列從 22px 長到 37px。</span></figcaption>
    <iframe src="a.html"></iframe></figure>
  <figure><figcaption><b>B · 一人一列</b><span>把表轉九十度。一個人一列、總分最大、右邊一條 21 格軌跡；點開看那個人的逐局。</span></figcaption>
    <iframe src="b.html"></iframe></figure>
  <figure><figcaption><b>C · 一疊卡</b><span>沒有橫表。頂上釘一條總分帶，底下一局一張卡，最新的在最上面。</span></figcaption>
    <iframe src="c.html"></iframe></figure>
</div>
