<div class="pg">
  <header class="top">
    <div class="mk"><b>11</b><u>UP &amp; DOWN</u></div>
    <div class="you">
      <button class="ghost">離開房間</button>
      <span class="nm">Francis</span>
      <img class="av" src="__AV__" alt="">
    </div>
  </header>

  <div class="body">
    <section class="plan">
      <div class="diagram">
        <div class="ring"></div>

        <span class="tick t1"></span>
        <span class="tick open t2"></span>
        <span class="tick open t3"></span>
        <span class="tick t4"></span>
        <span class="tick open t5"></span>
        <span class="tick t6"></span>

        <div class="mid">
          <span class="cap">房號</span>
          <span class="code">7K2M</span>
          <button class="copy"><i></i>按一下複製，貼給朋友</button>
        </div>

        <div class="p s1">
          <img class="av" src="__AV__" alt="">
          <div class="t"><b>Francis</b><span>房主 · 你</span></div>
        </div>
        <div class="p l s2">
          <div class="mono-av">哲</div>
          <div class="t"><b>阿哲</b><span>在線上</span></div>
        </div>
        <div class="p l open s3">
          <div class="ph"></div>
          <div class="t"><b>空位</b><span style="position:relative"><span class="wait">等人進來</span><span class="ai">放一個 AI</span></span></div>
        </div>
        <div class="p s4">
          <div class="mono-av">圓</div>
          <div class="t"><b>小圓</b><span>在線上</span></div>
        </div>
        <div class="p open s5">
          <div class="ph"></div>
          <div class="t"><b>空位</b><span style="position:relative"><span class="wait">等人進來</span><span class="ai">放一個 AI</span></span></div>
        </div>
        <div class="p open s6">
          <div class="ph"></div>
          <div class="t"><b>空位</b><span style="position:relative"><span class="wait">等人進來</span><span class="ai">放一個 AI</span></span></div>
        </div>
      </div>
    </section>

    <aside class="sheet">
      <div class="sheethd">
        <h2>這一桌的規則</h2>
        <button class="lnk" id="toSet">設定</button>
      </div>

      <div class="sect">
        <span class="cap">叫墩</span>
        <div class="r" data-k="bidMode"><span class="k">方式</span><i class="d"></i><span class="v">依序公開叫</span></div>
        <div class="r" data-k="hook"><span class="k">末位限制</span><i class="d"></i><span class="v">the hook</span></div>
      </div>
      <div class="sect">
        <span class="cap">牌</span>
        <div class="r" data-k="decks"><span class="k">牌組</span><i class="d"></i><span class="v">雙副</span></div>
        <div class="r" data-k="minRank"><span class="k">最小點數</span><i class="d"></i><span class="v">7 <small>以上</small></span></div>
        <div class="r" data-k="jokers"><span class="k">鬼牌</span><i class="d"></i><span class="v">不放</span></div>
      </div>
      <div class="sect">
        <span class="cap">計分</span>
        <div class="r" data-k="hit"><span class="k">叫中</span><i class="d"></i><span class="v">10＋叫</span></div>
        <div class="r" data-k="zero"><span class="k">叫 0 中了</span><i class="d"></i><span class="v">5 分</span></div>
        <div class="r" data-k="miss"><span class="k">沒叫中</span><i class="d"></i><span class="v">扣差額</span></div>
      </div>

      <div class="sect">
        <span class="cap">這樣算</span>
        <div class="r"><span class="k">叫 3，拿 3</span><i class="d"></i><span class="v">＋13</span></div>
        <div class="r"><span class="k">叫 0，拿 0</span><i class="d"></i><span class="v">＋5</span></div>
        <div class="r"><span class="k">叫 3，拿 4</span><i class="d"></i><span class="v">−1</span></div>
      </div>

      <div class="tot">
        <span>64 張牌 · 4 個人</span>
        <span><b>11</b> 張到頂 · <b>21</b> 局</span>
      </div>
      <button class="go">開始</button>
    </aside>
  </div>
</div>
