<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>登入 · 11 Up &amp; Down</title>
<meta name="description" content="用 Google 登入，坐上 11 Up &amp; Down 的牌桌。">
<meta name="theme-color" content="#1e2126">
<meta name="robots" content="noindex">
<meta property="og:title" content="11 Up &amp; Down">
<meta property="og:description" content="叫墩撲克。用 Google 登入就能上桌。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Bodoni+Moda:opsz,wght@6..96,400;6..96,600;6..96,700&display=swap">
<style>
/* ============================================================
   11 Up & Down — 登入頁
   跟大廳同一個世界：石板灰（大廳那張空桌的色，trump 為 null 時 paintTable 給的
   TABLE_NONE h250），字型、髮絲線、光暈都取自 docs/index.html 的 :root。
   這一頁只有一件事可以做，所以整頁只有一顆不透明的控制項——那顆還得是
   Google 規範的白底彩標，剛好就是唯一的高對比。
   ============================================================ */
html,body{margin:0;padding:0}
img{max-width:100%}
[hidden]{display:none!important}

:root{
  color-scheme:dark;

  --felt:      oklch(.285 .0098 250);
  --felt-deep: oklch(.197 .0078 250);
  --glow:      oklch(.400 .0137 250);

  --ink:    oklch(.965 .014 92);
  --ink-2:  oklch(.805 .017 92);
  --ink-3:  oklch(.700 .016 92);

  --hair:   oklch(.90 .02 92 / .155);
  --hair-2: oklch(.90 .02 92 / .075);

  --brass:     oklch(.845 .128 84);
  --brass-soft:oklch(.845 .128 84 / .16);
  --bad:  oklch(.735 .135 32);

  --e-out: cubic-bezier(.16,1,.3,1);

  /* 字標大小只有這一個旋鈕：桌機取 clamp 的上限，手機取中間那個 vw */
  --mark: 290px;
}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
h1{margin:0}

body{
  min-height:100dvh;display:flex;flex-direction:column;
  background:var(--felt-deep);
  color:var(--ink);
  font-family:"Archivo","Helvetica Neue",-apple-system,"PingFang TC","Noto Sans TC",sans-serif;
  font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
/* 七層極淡光暈：跟牌桌同一張底，死平的深色才會呼吸 */
body::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(circle at 18% 6%,  rgba(255,255,255,.050), transparent 9%),
    radial-gradient(circle at 42% 11%, rgba(255,255,255,.038), transparent 11%),
    radial-gradient(circle at 24% 27%, rgba(255,255,255,.046), transparent 12%),
    radial-gradient(circle at 63% 38%, rgba(255,255,255,.042), transparent 15%),
    radial-gradient(circle at 48% 62%, rgba(255,255,255,.040), transparent 11%),
    radial-gradient(circle at 89% 78%, rgba(255,255,255,.052), transparent 13%),
    radial-gradient(circle at 58% 92%, rgba(255,255,255,.062), transparent 18%),
    radial-gradient(125% 95% at 50% 14% in oklab, var(--glow) 0%, var(--felt) 58%, var(--felt-deep) 100%);
}
::selection{background:var(--brass-soft);color:var(--ink)}
:focus-visible{outline:2px solid var(--brass);outline-offset:3px;border-radius:99px}

.gate{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:40px clamp(18px,4vw,40px);
  padding-bottom:calc(40px + env(safe-area-inset-bottom));
  text-align:center;width:100%;
  animation:in .5s var(--e-out) both;
}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.gate{animation:none}}

/* ---- 字標：「11」本身就是標誌 ---- */
.lock{display:flex;flex-direction:column;align-items:center;margin-bottom:52px}
.big{
  font-family:"Bodoni Moda",Georgia,"Songti TC",serif;
  font-weight:700;line-height:.78;letter-spacing:-.045em;
  font-size:clamp(150px,27vw,var(--mark));
  /* 由上往下微微收暗，數字才不是一塊死白 */
  background:linear-gradient(170deg in oklab,var(--ink),oklch(.72 .014 92));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.name{display:flex;align-items:center;gap:26px;margin-top:10px}
.name i{width:clamp(22px,5vw,54px);height:1px;background:var(--hair);display:block}
.name span{
  font-family:"Bodoni Moda",Georgia,serif;
  font-size:clamp(18px,2.6vw,30px);font-weight:600;
  letter-spacing:.3em;text-indent:.3em;color:var(--ink-2);white-space:nowrap;
}

/* ---- 唯一的控制項。Google 的鈕照官方規範：白底、彩色 G、形狀不改 ---- */
.gbtn{
  display:inline-flex;align-items:center;justify-content:center;gap:12px;
  padding:0 26px;height:50px;border-radius:99px;
  background:#FFFFFF;color:#1F1F1F;font-size:15px;font-weight:500;letter-spacing:.01em;
  box-shadow:0 1px 2px rgba(0,0,0,.34),0 12px 34px rgba(0,0,0,.34);
  transition:transform .18s var(--e-out),box-shadow .22s,background .18s;
}
.gbtn:hover:not(:disabled){background:#F4F4F4;box-shadow:0 1px 2px rgba(0,0,0,.34),0 16px 44px rgba(0,0,0,.42)}
.gbtn:active:not(:disabled){transform:scale(.985)}
.gbtn:disabled{cursor:default;background:#E6E4DE;color:#6B6863;box-shadow:none}
.gbtn svg{width:19px;height:19px;flex:none}
.gbtn .spin{
  width:17px;height:17px;flex:none;border-radius:99px;
  border:2px solid rgba(31,31,31,.22);border-top-color:#1F1F1F;
  animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

.err{
  margin:26px 0 0;padding:11px 0;max-width:44ch;
  border-top:1px solid oklch(.735 .135 32 / .3);
  border-bottom:1px solid oklch(.735 .135 32 / .3);
  font-size:12.5px;color:var(--ink-2);
}
.err b{color:var(--bad);font-weight:600}

@media (max-width:760px){
  .lock{margin-bottom:40px}
  .name{gap:13px}
}
</style>
</head>
<body>
<main class="gate">

  <div class="lock">
    <h1 class="big">11</h1>
    <div class="name"><i></i><span>UP &amp; DOWN</span><i></i></div>
  </div>

  <button class="gbtn" id="go">
    <span class="spin" id="goSpin" hidden></span>
    <svg viewBox="0 0 48 48" id="goMark" aria-hidden="true" focusable="false">
      <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
      <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
      <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
      <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
    </svg>
    <span id="goLabel">使用 Google 帳號登入</span>
  </button>

  <p class="err" id="err" hidden></p>

</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"></script>
<script>
/* ================= 登入 ================= */
const SB_URL = "https://psuchtzacdppdpltpglg.supabase.co";
const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBzdWNodHphY2RwcGRwbHRwZ2xnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5NjA5MTEsImV4cCI6MjEwNDUzNjkxMX0.BOjc9PB7iieZsfE07ia18Y0o3VDwmOgDFTQheeN-ezc";

const go = document.getElementById("go");
const goLabel = document.getElementById("goLabel");
const errEl = document.getElementById("err");

function fail(msg, detail){
  errEl.hidden = false;
  errEl.innerHTML = '<b>' + msg + '</b>' + (detail ? '<br>' + detail : '');
}
function busy(on, label){
  go.disabled = on;
  goLabel.textContent = label || "使用 Google 帳號登入";
  document.getElementById("goSpin").hidden = !on;
  document.getElementById("goMark").hidden = on;
}

/* 登入完要回到哪：?next= 允許同站的相對路徑，其他一律回牌桌。
   不檢查的話這顆按鈕就是一個開放轉址器。 */
function nextUrl(){
  const table = new URL("./", location.href);
  let next = "";
  try{ next = new URLSearchParams(location.search).get("next") || ""; }catch(e){}
  if(!next) return table.href;
  if(!/^[^/\\]|^\/[^/\\]/.test(next)) return table.href;   /* //evil.com、\\evil.com 擋掉 */
  const u = new URL(next, table);
  return u.origin === location.origin ? u.href : table.href;
}

if(!window.supabase || !window.supabase.createClient){
  fail("連線元件沒載入成功", "重新整理一次通常就好了。");
  go.disabled = true;
}else{
  const sb = window.supabase.createClient(SB_URL, SB_KEY, {
    auth:{ persistSession:true, autoRefreshToken:true, detectSessionInUrl:true, flowType:"pkce" }
  });

  /* signInWithOAuth 不會先問伺服器，它自己就把瀏覽器導去 /authorize。
     provider 沒開通的話那個網址回的是一頁 JSON 錯誤——使用者會直接看到那串。
     所以先問一次 /auth/v1/settings（公開端點），沒開就在這裡說清楚，不要把人送出去。 */
  const providerReady = (async function(){
    try{
      const r = await fetch(SB_URL + "/auth/v1/settings", {headers:{apikey:SB_KEY}});
      const d = await r.json();
      return !!(d && d.external && d.external.google);
    }catch(e){ return null; }   /* 問不到就別擋，讓使用者試 */
  })();
  function notReady(){
    fail("Google 登入還沒開通",
      "Supabase 專案的 Google provider 目前是關的。後台開啟之後這顆按鈕就會動——這一頁不用改。");
  }
  providerReady.then(function(ok){ if(ok === false) notReady(); });

  /* OAuth 失敗會帶著 error 回到 redirectTo，而不是丟例外 */
  (function(){
    const q = new URLSearchParams(location.search);
    const h = new URLSearchParams(location.hash.replace(/^#/, ""));
    const e = q.get("error_description") || q.get("error") || h.get("error_description") || h.get("error");
    if(e) fail("Google 登入沒完成", String(e).slice(0, 200));
  })();

  /* 已經登入過就不要再看到這一頁 */
  sb.auth.getSession().then(function(r){
    if(r && r.data && r.data.session) location.replace(nextUrl());
  }).catch(function(){});

  go.addEventListener("click", async function(){
    errEl.hidden = true;
    busy(true, "正在轉往 Google…");
    try{
      if(await providerReady === false){ busy(false); notReady(); return; }
      const { error } = await sb.auth.signInWithOAuth({
        provider:"google",
        options:{
          redirectTo: nextUrl(),
          queryParams:{ prompt:"select_account" }   /* 多帳號的人要能挑 */
        }
      });
      if(error) throw error;
      /* 成功的話瀏覽器已經在轉址，這裡不會再跑到 */
    }catch(err){
      const msg = String((err && err.message) || err);
      busy(false);
      if(/provider is not enabled/i.test(msg)) notReady();
      else fail("登入沒能開始", msg.slice(0, 200));
    }
  });
}
</script>
</body>
</html>
